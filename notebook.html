<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook</title>
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/di8stbg60/image/upload/v1757245484/SYAMDIGITAL-LOGO-2025_mmpllg.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .note-card { transition: all 0.3s ease; }
        .note-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">📝 Nota Saya</h1>
            <p class="text-gray-600">Catat ide dan pemikiran Anda dengan mudah</p>
        </div>

        <!-- Add Note Form -->
        <div class="bg-white/70 backdrop-blur-sm rounded-2xl shadow-lg p-6 mb-8 border border-white/20">
            <div class="flex flex-col space-y-4">
                <input 
                    type="text" 
                    id="noteTitle" 
                    placeholder="Judul nota..."
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition-all duration-200 bg-white/80"
                >
                <textarea 
                    id="noteContent" 
                    placeholder="Tulis nota Anda di sini..."
                    rows="4"
                    class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition-all duration-200 resize-none bg-white/80"
                ></textarea>
                <div class="flex justify-between items-center">
                    <div class="flex space-x-2">
                        <button onclick="setColor('bg-yellow-100 border-yellow-200')" class="w-6 h-6 rounded-full bg-yellow-200 border-2 border-yellow-300 hover:scale-110 transition-transform"></button>
                        <button onclick="setColor('bg-green-100 border-green-200')" class="w-6 h-6 rounded-full bg-green-200 border-2 border-green-300 hover:scale-110 transition-transform"></button>
                        <button onclick="setColor('bg-blue-100 border-blue-200')" class="w-6 h-6 rounded-full bg-blue-200 border-2 border-blue-300 hover:scale-110 transition-transform"></button>
                        <button onclick="setColor('bg-pink-100 border-pink-200')" class="w-6 h-6 rounded-full bg-pink-200 border-2 border-pink-300 hover:scale-110 transition-transform"></button>
                        <button onclick="setColor('bg-purple-100 border-purple-200')" class="w-6 h-6 rounded-full bg-purple-200 border-2 border-purple-300 hover:scale-110 transition-transform"></button>
                    </div>
                    <button 
                        onclick="addNote()" 
                        class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white px-6 py-2 rounded-xl hover:from-indigo-600 hover:to-purple-700 transition-all duration-200 font-medium shadow-lg hover:shadow-xl"
                    >
                        ✨ Tambah Nota
                    </button>
                </div>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="mb-8">
            <div class="relative max-w-md mx-auto">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="🔍 Cari nota..."
                    onkeyup="searchNotes()"
                    class="w-full px-4 py-3 pl-12 rounded-xl border border-gray-200 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 outline-none transition-all duration-200 bg-white/80"
                >
            </div>
        </div>

        <!-- Preview Modal -->
        <div id="previewModal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 hidden items-center justify-center p-4">
            <div class="bg-white rounded-3xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-hidden flex flex-col">
                <div class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 p-6 text-white flex-shrink-0">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 bg-white/20 rounded-full flex items-center justify-center">👁️</div>
                            <h2 class="text-2xl font-bold">Preview Nota</h2>
                        </div>
                        <button onclick="closePreviewModal()" class="text-white/80 hover:text-white text-3xl font-light">×</button>
                    </div>
                </div>
                <div class="p-8 overflow-y-auto flex-1">
                    <div id="previewContent" class="space-y-6"></div>
                </div>
                <div class="bg-gray-50 px-8 py-6 border-t border-gray-200 flex-shrink-0">
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div class="flex items-center space-x-4 text-sm text-gray-500">
                            <span>📅 <span id="previewDate"></span></span>
                            <span>•</span>
                            <span>🕒 <span id="previewTime"></span></span>
                        </div>
                        <div class="flex space-x-3">
                            <button onclick="generatePDF()" class="bg-gradient-to-r from-red-500 to-pink-600 text-white px-6 py-3 rounded-xl font-medium shadow-lg hover:shadow-xl flex items-center space-x-2">
                                <span>📄</span><span>PDF</span>
                            </button>
                            <button onclick="editFromPreview()" class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white px-6 py-3 rounded-xl font-medium shadow-lg hover:shadow-xl flex items-center space-x-2">
                                <span>✏️</span><span>Edit</span>
                            </button>
                            <button onclick="closePreviewModal()" class="bg-gray-200 text-gray-700 px-6 py-3 rounded-xl font-medium">Tutup</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Edit Modal -->
        <div id="editModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">✏️ Edit Nota</h2>
                    <button onclick="closeEditModal()" class="text-gray-500 text-2xl">×</button>
                </div>
                <div class="space-y-4">
                    <input type="text" id="editNoteTitle" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none">
                    <textarea id="editNoteContent" rows="6" class="w-full px-4 py-3 rounded-xl border border-gray-200 outline-none resize-none"></textarea>
                    <div class="flex justify-between items-center">
                        <div class="flex space-x-2">
                            <button onclick="setEditColor('bg-yellow-100 border-yellow-200')" class="w-8 h-8 rounded-full bg-yellow-200 border-2 border-yellow-300"></button>
                            <button onclick="setEditColor('bg-green-100 border-green-200')" class="w-8 h-8 rounded-full bg-green-200 border-2 border-green-300"></button>
                            <button onclick="setEditColor('bg-blue-100 border-blue-200')" class="w-8 h-8 rounded-full bg-blue-200 border-2 border-blue-300"></button>
                            <button onclick="setEditColor('bg-pink-100 border-pink-200')" class="w-8 h-8 rounded-full bg-pink-200 border-2 border-pink-300"></button>
                            <button onclick="setEditColor('bg-purple-100 border-purple-200')" class="w-8 h-8 rounded-full bg-purple-200 border-2 border-purple-300"></button>
                        </div>
                        <div class="flex space-x-3">
                            <button onclick="closeEditModal()" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-xl">Batal</button>
                            <button onclick="saveEditedNote()" class="bg-indigo-600 text-white px-6 py-2 rounded-xl shadow">💾 Simpan</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Success Modal -->
        <div id="successModal" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 hidden items-center justify-center p-4">
            <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden text-center">
                <div class="bg-emerald-500 p-8 text-white">
                    <div class="text-4xl mb-2">✅</div>
                    <h2 class="text-2xl font-bold">Download Berhasil!</h2>
                    <p class="text-emerald-100">PDF telah berhasil diunduh</p>
                </div>
                <div class="p-6">
                    <p class="font-semibold text-gray-800 mb-4" id="downloadedFileName">nota_file.pdf</p>
                    <button onclick="closeSuccessModal()" class="bg-gray-100 text-gray-700 px-8 py-3 rounded-xl font-medium w-full">Selesai</button>
                </div>
            </div>
        </div>

        <!-- Notes Grid -->
        <div id="notesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-16">
            <div class="text-6xl mb-4">📝</div>
            <h3 class="text-xl font-semibold text-gray-600 mb-2">Belum ada nota</h3>
            <p class="text-gray-500">Mulai dengan menambahkan nota pertama Anda!</p>
        </div>

        <!-- Beranda Link -->
        <div class="mt-12 text-center">
            <a href="https://syam.digital/" class="inline-flex items-center px-8 py-4 bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 text-white font-bold rounded-full shadow-2xl hover:scale-105 transition-transform">
                <span>Kembali Ke Beranda</span>
            </a>
        </div>
    </div>

    <script>
        let notes = [];
        let selectedColor = 'bg-white border-gray-200';
        let editingNoteId = null;
        let editSelectedColor = 'bg-white border-gray-200';
        let previewingNoteId = null;

        function saveNotes() {
            try {
                localStorage.setItem('notes', JSON.stringify(notes));
            } catch (error) {
                console.error('Error menyimpan nota:', error);
            }
        }

        function loadNotes() {
            try {
                let loadedNotes = localStorage.getItem('notes');
                if (loadedNotes) {
                    notes = JSON.parse(loadedNotes);
                }
            } catch (error) {
                console.error('Error memuat nota:', error);
                notes = [];
            }
            displayNotes();
        }

        function setColor(color) { selectedColor = color; }
        function setEditColor(color) { editSelectedColor = color; }

        function addNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();
            if (!title && !content) {
                alert('Mohon isi judul atau konten nota!');
                return;
            }

            const note = {
                id: Date.now(),
                title: title || 'Nota Tanpa Judul',
                content: content,
                color: selectedColor,
                date: new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' }),
                time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
            };

            notes.unshift(note);
            saveNotes();
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            displayNotes();
        }

        function deleteNote(id) {
            if (confirm('Yakin ingin menghapus nota ini?')) {
                notes = notes.filter(note => note.id !== id);
                saveNotes();
                displayNotes();
            }
        }

        function displayNotes(notesToDisplay = notes) {
            const container = document.getElementById('notesContainer');
            const emptyState = document.getElementById('emptyState');

            if (notesToDisplay.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = notesToDisplay.map(note => `
                <div class="note-card ${note.color} rounded-2xl p-6 border shadow-sm relative flex flex-col justify-between">
                    <div>
                        <h3 class="font-bold text-xl text-gray-800 mb-2">${note.title}</h3>
                        <p class="text-gray-600 line-clamp-4 whitespace-pre-line mb-4">${note.content}</p>
                    </div>
                    <div>
                        <div class="text-xs text-gray-400 mb-4">${note.date} • ${note.time}</div>
                        <div class="flex justify-end space-x-2">
                            <button onclick="previewNote(${note.id})" class="p-2 bg-white/80 hover:bg-white rounded-lg text-indigo-600 shadow-sm" title="Preview">👁️</button>
                            <button onclick="editNote(${note.id})" class="p-2 bg-white/80 hover:bg-white rounded-lg text-purple-600 shadow-sm" title="Edit">✏️</button>
                            <button onclick="deleteNote(${note.id})" class="p-2 bg-white/80 hover:bg-white rounded-lg text-red-600 shadow-sm" title="Hapus">🗑️</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function searchNotes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = notes.filter(n => n.title.toLowerCase().includes(query) || n.content.toLowerCase().includes(query));
            displayNotes(filtered);
        }

        function previewNote(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;
            previewingNoteId = id;
            document.getElementById('previewContent').innerHTML = `
                <div class="text-center mb-6">
                    <h1 class="text-3xl font-bold text-gray-800">${note.title}</h1>
                </div>
                <div class="bg-gray-50 rounded-2xl p-6 border border-gray-100 whitespace-pre-line text-gray-700 leading-relaxed">${note.content || '<em>Tidak ada konten</em>'}</div>
            `;
            document.getElementById('previewDate').textContent = note.date;
            document.getElementById('previewTime').textContent = note.time;
            document.getElementById('previewModal').classList.remove('hidden');
            document.getElementById('previewModal').classList.add('flex');
        }

        function closePreviewModal() {
            document.getElementById('previewModal').classList.add('hidden');
            document.getElementById('previewModal').classList.remove('flex');
        }

        function editNote(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;
            editingNoteId = id;
            editSelectedColor = note.color;
            document.getElementById('editNoteTitle').value = note.title;
            document.getElementById('editNoteContent').value = note.content;
            document.getElementById('editModal').classList.remove('hidden');
            document.getElementById('editModal').classList.add('flex');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            document.getElementById('editModal').classList.remove('flex');
        }

        function saveEditedNote() {
            const note = notes.find(n => n.id === editingNoteId);
            if (note) {
                note.title = document.getElementById('editNoteTitle').value.trim() || 'Nota Tanpa Judul';
                note.content = document.getElementById('editNoteContent').value.trim();
                note.color = editSelectedColor;
                saveNotes();
                displayNotes();
                closeEditModal();
            }
        }

        function editFromPreview() {
            if (previewingNoteId) {
                closePreviewModal();
                editNote(previewingNoteId);
            }
        }

        // ==========================================
        // FITUR EKSPOR PDF DIPERBAIKI SECARA VISUAL
        // ==========================================
        function generatePDF() {
            if (!previewingNoteId) return;
            const note = notes.find(n => n.id === previewingNoteId);
            if (!note) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ unit: 'mm', format: 'a4' });

            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const margin = 20;
            const contentWidth = pageWidth - (margin * 2);

            // 1. Header Banner Gradient
            doc.setFillColor(99, 102, 241); // Indigo
            doc.rect(0, 0, pageWidth, 35, 'F');

            doc.setTextColor(255, 255, 255);
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(18);
            doc.text("NOTA DIGITAL", margin, 20);

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(10);
            doc.text("Syam Digital Notebook", margin, 27);

            // 2. Metadata Box
            doc.setFillColor(248, 250, 252);
            doc.setDrawColor(226, 232, 240);
            doc.roundedRect(margin, 45, contentWidth, 18, 3, 3, 'FD');

            doc.setTextColor(71, 85, 105);
            doc.setFontSize(9);
            doc.setFont('helvetica', 'bold');
            doc.text("Tanggal:", margin + 5, 56);
            doc.setFont('helvetica', 'normal');
            doc.text(`${note.date} (${note.time})`, margin + 22, 56);

            // 3. Judul Nota
            doc.setTextColor(30, 41, 59);
            doc.setFontSize(16);
            doc.setFont('helvetica', 'bold');
            const splitTitle = doc.splitTextToSize(note.title, contentWidth);
            doc.text(splitTitle, margin, 75);

            let currentY = 75 + (splitTitle.length * 8) + 5;

            // Garis Pembatas
            doc.setDrawColor(203, 213, 225);
            doc.line(margin, currentY, pageWidth - margin, currentY);
            currentY += 10;

            // 4. Isi Konten
            doc.setFontSize(11);
            doc.setFont('helvetica', 'normal');
            doc.setTextColor(51, 65, 85);

            const splitContent = doc.splitTextToSize(note.content || "Tidak ada isi nota.", contentWidth);
            
            // Loop per baris dengan proteksi halaman baru (Auto Page Break)
            for (let i = 0; i < splitContent.length; i++) {
                if (currentY > pageHeight - 25) {
                    doc.addPage();
                    currentY = 20;
                }
                doc.text(splitContent[i], margin, currentY);
                currentY += 7;
            }

            // 5. Footer
            const totalPages = doc.internal.getNumberOfPages();
            for (let j = 1; j <= totalPages; j++) {
                doc.setPage(j);
                doc.setFontSize(8);
                doc.setTextColor(148, 163, 184);
                doc.text(`Dibuat via Syam Digital • Halaman ${j} dari ${totalPages}`, pageWidth / 2, pageHeight - 10, { align: 'center' });
            }

            const fileName = `${note.title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}_nota.pdf`;
            doc.save(fileName);

            document.getElementById('downloadedFileName').textContent = fileName;
            closePreviewModal();
            document.getElementById('successModal').classList.remove('hidden');
            document.getElementById('successModal').classList.add('flex');
        }

        function closeSuccessModal() {
            document.getElementById('successModal').classList.add('hidden');
            document.getElementById('successModal').classList.remove('flex');
        }

        // Inisialisasi awal
        window.onload = loadNotes;
    </script>
</body>
</html>
