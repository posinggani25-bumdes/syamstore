<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syam Digital - Kontak Kami</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contact-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }

        .contact-card h2 {
            color: #0d6efd;
            margin-bottom: 8px;
            text-align: center;
        }

        .contact-card p {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #0d6efd;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #0d6efd;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #0b5ed7;
        }

        .btn-submit:disabled {
            background-color: #a5c7fe;
            cursor: not-allowed;
        }

        #alert-msg {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
            text-align: center;
        }

        .alert-success {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #842029;
        }
    </style>
</head>
<body>

    <div class="contact-card">
        <h2>Syam Digital</h2>
        <p>Hubungi kami melalui formulir di bawah ini.</p>

        <form id="contact-form" name="submit-to-google-sheet">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
            </div>

            <div class="form-group">
                <label for="email">Alamat Email</label>
                <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
            </div>

            <div class="form-group">
                <label for="pesan">Pesan / Pertanyaan</label>
                <textarea id="pesan" name="pesan" rows="4" placeholder="Tuliskan pesan Anda..." required></textarea>
            </div>

            <button type="submit" class="btn-submit" id="btn-kirim">Kirim Pesan</button>
        </form>

        <div id="alert-msg"></div>
    </div>

    <script>
        // Tempelkan URL Google Apps Script Anda di bawah ini
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwelIX-AnhQmOgLLr7NPbplC-8ExLES0KQiJjNsq97cvR3UTIgP5C1DDd60oyaQTEf3nA/exec';
        
        const form = document.forms['submit-to-google-sheet'];
        const btnKirim = document.getElementById('btn-kirim');
        const alertMsg = document.getElementById('alert-msg');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            // Ubah tombol saat proses pengiriman
            btnKirim.disabled = true;
            btnKirim.innerHTML = 'Mengirim...';
            alertMsg.style.display = 'none';

            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => {
                    btnKirim.disabled = false;
                    btnKirim.innerHTML = 'Kirim Pesan';
                    
                    // Tampilkan pesan sukses
                    alertMsg.className = 'alert-success';
                    alertMsg.innerHTML = 'Terima kasih! Pesan Anda telah terkirim.';
                    alertMsg.style.display = 'block';
                    
                    // Reset formulir
                    form.reset();
                })
                .catch(error => {
                    btnKirim.disabled = false;
                    btnKirim.innerHTML = 'Kirim Pesan';
                    
                    // Tampilkan pesan gagal
                    alertMsg.className = 'alert-danger';
                    alertMsg.innerHTML = 'Gagal mengirim pesan. Silakan coba lagi.';
                    alertMsg.style.display = 'block';
                    console.error('Error!', error.message);
                });
        });
    </script>

</body>
</html>
